name: Build Kotlin APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          # ⬇️ نام فایل دقیقاً مطابق با فایل آپلود شده در گیت‌هاب تنظیم شد ⬇️
          ZIP_FILE="CoolerController_Fixed (1).zip"
          
          if [ ! -f "$ZIP_FILE" ]; then 
            echo "❌ فایل پیدا نشد: $ZIP_FILE"
            ls -la
            exit 1
          fi
          
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PROJECT_DIR=$(find extracted -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then 
            echo "❌ پوشه پروژه (settings.gradle) پیدا نشد"
            exit 1
          fi
          
          echo "✅ پروژه در مسیر $PROJECT_DIR پیدا شد"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy Icon to Project
        run: |
          set -e
          ICON_FILE="icon.png"
          if [ -f "$ICON_FILE" ]; then
            echo "✅ آیکون پیدا شد: $ICON_FILE"
            RES_DIR=$(find ${{ env.PROJECT_DIR }} -path "*/src/main/res" -type d | head -n 1)
            if [ -z "$RES_DIR" ]; then 
              echo "❌ پوشه res پیدا نشد!"; exit 1
            fi
            
            for folder in $RES_DIR/mipmap-*; do
              if [ -d "$folder" ]; then
                cp "$ICON_FILE" "$folder/ic_launcher.png"
                # حذف فایل xml در صورت وجود، تا آیکون png جایگزین شود
                if [ -f "$folder/ic_launcher.xml" ]; then
                  rm "$folder/ic_launcher.xml"
                fi
              fi
            done
            echo "✅ آیکون در تمام پوشه‌های mipmap کپی شد."
          else
            echo "⚠️ آیکون پیدا نشد. از آیکون پیش‌فرض استفاده می‌شود."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Unsigned APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease

      - name: Find apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then 
            yes | sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
            APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | head -n 1)
          fi
          echo "APKSIGNER_PATH=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Sign APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # پیدا کردن فایل APK تولید شده توسط Gradle
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_PATH" ]; then 
            echo "❌ فایل APK برای امضا پیدا نشد"; 
            exit 1; 
          fi
          
          echo "🔍 فایل APK پیدا شد در: $APK_PATH"
          
          # ساخت کی‌استور موقت
          keytool -genkeypair -v \
            -keystore mykey.keystore \
            -alias myalias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mypassword -keypass mypassword \
            -dname "CN=CoolerApp, OU=Dev, O=Dev, L=Tehran, S=Tehran, C=IR"
          
          # امضای فایل APK
          ${{ env.APKSIGNER_PATH }} sign \
            --ks mykey.keystore \
            --ks-pass pass:mypassword \
            --key-pass pass:mypassword \
            --ks-key-alias myalias \
            "$APK_PATH"
          
          # تغییر نام فایل به app-release-signed.apk در همان پوشه خروجی
          NEW_APK_PATH=$(dirname "$APK_PATH")/app-release-signed.apk
          mv "$APK_PATH" "$NEW_APK_PATH"
          
          # ذخیره مسیر کامل و مطلق در متغیر محیطی برای مرحله بعد
          echo "SIGNED_APK_PATH=$(pwd)/$NEW_APK_PATH" >> "$GITHUB_ENV"
          echo "✅ فایل APK با موفقیت امضا شد: $NEW_APK_PATH"

      - name: Verify Signed APK Exists
        run: |
          if [ -f "${{ env.SIGNED_APK_PATH }}" ]; then
            echo "✅ فایل APK امضا شده پیدا شد: ${{ env.SIGNED_APK_PATH }}"
            ls -lh "${{ env.SIGNED_APK_PATH }}"
          else
            echo "❌ فایل APK امضا شده پیدا نشد!"
            exit 1
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerController-Signed-APK
          path: ${{ env.SIGNED_APK_PATH }}
