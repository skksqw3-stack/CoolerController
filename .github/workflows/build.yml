name: Build Kotlin APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE="CoolerController.zip"
          if [ ! -f "$ZIP_FILE" ]; then 
            echo "فایل پیدا نشد: $ZIP_FILE"; ls -la; exit 1
          fi
          echo "✅ در حال باز کردن فایل: $ZIP_FILE"
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PROJECT_DIR=$(find extracted -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then 
            echo "پوشه پروژه کاتلین پیدا نشد"; 
            find extracted -type f | head -20;
            exit 1; 
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease

      # 🌟 مرحله جادویی: پیدا کردن فایل APK در هر مسیری که باشد
      - name: Find and Upload APK
        run: |
          set -e
          echo "در حال جستجوی فایل APK..."
          # پیدا کردن همه فایل‌های apk در پوشه build
          find extracted -name "*.apk" -type f
          
          # آپلود همه فایل‌های apk پیدا شده
          APK_PATH=$(find extracted -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "هیچ فایل APK پیدا نشد!"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerController-APK
          path: ${{ env.APK_PATH }}
