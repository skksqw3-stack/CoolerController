name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          # 🌟 نام فایل زیپ جدید شما
          ZIP_FILE="CoolerController.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then 
            echo "فایل پیدا نشد: $ZIP_FILE"; ls -la; exit 1
          fi
          
          echo "✅ در حال باز کردن فایل: $ZIP_FILE"
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          # پیدا کردن مسیر پروژه (جایی که settings.gradle یا build.gradle وجود دارد)
          PROJECT_DIR=$(find extracted -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then echo "PROJECT_DIR پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ ! -f "gradlew" ]; then
            echo "gradlew وجود ندارد، در حال ساخت..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerController-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
