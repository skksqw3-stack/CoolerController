name: Build Kotlin APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE="CoolerController.zip"
          if [ ! -f "$ZIP_FILE" ]; then 
            echo "فایل پیدا نشد: $ZIP_FILE"; exit 1
          fi
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then echo "پروژه پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      # ساخت APK بدون امضا (همانطور که قبلا بود)
      - name: Build Unsigned APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease

      # 🌟 پیدا کردن فایل APK و امضای آن با ابزار apksigner
      - name: Sign the APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # پیدا کردن فایل APK
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK پیدا نشد"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          
          # پیدا کردن ابزار apksigner از Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" -type f | head -n 1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner پیدا نشد"; exit 1; fi
          
          # ساخت کلید امضا
          keytool -genkeypair -v -keystore mykey.keystore -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword -keypass mypassword -dname "CN=CoolerApp, OU=Dev, O=Dev, L=Tehran, S=Tehran, C=IR"
          
          # امضای فایل APK
          $APKSIGNER sign --ks mykey.keystore --ks-pass pass:mypassword --key-pass pass:mypassword --ks-key-alias myalias "$APK_PATH"
          echo "✅ APK با موفقیت امضا شد."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerController-Signed-APK
          path: ${{ env.APK_PATH }}
